<div class="shell">
  <div class="left">
    <div class="brand">✂️ BarberBook</div>
    <h1>Your account,<br><span class="g">your appointments.</span></h1>
    <p>Register and keep track of all your bookings.</p>
  </div>
  <div class="right">
    <div class="card">
      <h2>Create Account</h2>
      <p class="sub">Free & ready in seconds</p>
      @if (error) { <div class="err">{{ error }}</div> }
      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label>Name</label>
          <input type="text" [(ngModel)]="name" name="name" required placeholder="John Doe" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="your@email.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" required placeholder="At least 6 characters" />
        </div>
        <button type="submit" [disabled]="loading">{{ loading ? 'Creating...' : 'Create Account' }}</button>
      </form>
      <p class="sw">Already have an account? <a routerLink="/login">Sign In</a></p>
    </div>
  </div>
</div>
